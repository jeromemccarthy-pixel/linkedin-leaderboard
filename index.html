
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fanbase LinkedIn Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  :root { --fb-green: #00ad66; --fb-green-dark: #008a52; --fb-black: #111111; --fb-white: #ffffff; }

  body {
    background: var(--fb-black); color: var(--fb-white);
    font-family: 'Inter', -apple-system, sans-serif;
    min-height: 100vh; overflow-x: hidden;
  }
  body::before {
    content: ''; position: fixed; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 500px; height: 500px;
    border: 2px solid rgba(0,173,102,0.04);
    border-radius: 50%; pointer-events: none; z-index: 0;
  }

  .header {
    padding: 32px 32px 0;
    display: flex; align-items: center; justify-content: space-between;
    flex-wrap: wrap; gap: 16px; position: relative; z-index: 10;
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header h1 {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: 32px; font-weight: 900; letter-spacing: 3px;
    text-transform: uppercase; line-height: 1;
  }
  .header .subtitle {
    color: rgba(255,255,255,0.35); font-size: 12px; margin-top: 4px;
    font-weight: 400; letter-spacing: 0.5px;
  }
  .eligibility-badge {
    background: rgba(0,173,102,0.1); border: 1px solid rgba(0,173,102,0.2);
    border-radius: 8px; padding: 8px 14px; font-size: 10px;
    color: var(--fb-green); font-weight: 600;
  }

  .loading-msg {
    text-align: center; padding: 80px 32px;
    color: rgba(255,255,255,0.4); font-size: 14px;
    position: relative; z-index: 10;
  }
  .loading-msg .spinner {
    display: inline-block; width: 20px; height: 20px;
    border: 2px solid rgba(0,173,102,0.3); border-top-color: var(--fb-green);
    border-radius: 50%; animation: spin 0.8s linear infinite;
    margin-right: 10px; vertical-align: middle;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .error-msg {
    text-align: center; padding: 80px 32px;
    color: #ff6b6b; font-size: 14px;
    position: relative; z-index: 10;
  }

  .charts-container {
    padding: 28px 32px 40px;
    display: flex; gap: 24px; flex-wrap: wrap;
    position: relative; z-index: 10;
  }

  .chart-wrapper {
    flex: 1; min-width: 360px;
    background: rgba(255,255,255,0.03);
    border-radius: 16px; border: 1px solid rgba(255,255,255,0.06);
    padding: 28px 24px 20px; position: relative; overflow: hidden;
  }
  .chart-wrapper::before {
    content: ''; position: absolute; top: -60px; right: -60px;
    width: 200px; height: 200px;
    border: 1.5px solid rgba(0,173,102,0.08);
    border-radius: 50%; pointer-events: none;
  }

  .chart-header { margin-bottom: 16px; }
  .chart-title {
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    font-size: 22px; font-weight: 900; letter-spacing: 2px;
    text-transform: uppercase; line-height: 1;
  }
  .chart-subtitle {
    color: rgba(255,255,255,0.45); font-size: 12px;
    margin-top: 6px; font-weight: 400;
  }

  .chart-area {
    position: relative; height: 460px;
    padding-bottom: 30px;
  }

  .x-axis-label {
    position: absolute; bottom: 4px; left: 0;
    font-size: 9px; font-weight: 600;
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    letter-spacing: 1px; text-transform: uppercase;
    color: rgba(255,255,255,0.3);
  }

  .bars-row {
    display: flex; gap: 6px; width: 100%;
    height: calc(100% - 30px);
    align-items: flex-end;
    position: relative; z-index: 5;
  }

  .bar-col {
    flex: 1; min-width: 36px; max-width: 80px;
    display: flex; flex-direction: column; align-items: center;
    position: relative; height: 100%; justify-content: flex-end;
  }

  .bar-top-value {
    position: absolute; z-index: 25;
    width: 100%; text-align: center;
    color: var(--fb-green); font-weight: 900; font-size: 13px;
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    letter-spacing: 1px;
    transition: bottom 0.8s cubic-bezier(.4,0,.2,1);
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }

  .avatar-top {
    width: 40px; height: 40px; border-radius: 50%;
    background: linear-gradient(135deg, var(--fb-green) 0%, var(--fb-green-dark) 100%);
    display: flex; align-items: center; justify-content: center;
    border: 2.5px solid var(--fb-green);
    box-shadow: 0 2px 12px rgba(0,173,102,0.35);
    position: absolute; z-index: 20;
    transition: bottom 0.8s cubic-bezier(.4,0,.2,1);
    overflow: hidden;
  }
  .avatar-top span {
    color: #fff; font-weight: 800; font-size: 14px;
    letter-spacing: 0.5px; font-family: 'Bebas Neue', 'Impact', sans-serif;
  }
  .avatar-top img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%;
  }

  .bar {
    width: 100%;
    background: linear-gradient(180deg, rgba(0,173,102,0.85) 0%, rgba(0,138,82,0.85) 100%);
    border-radius: 5px 5px 0 0; position: relative;
    transition: height 0.8s cubic-bezier(.4,0,.2,1);
    box-shadow: 0 0 20px rgba(0,173,102,0.12);
    min-height: 2px;
  }

  .bar-bottom-value {
    position: absolute; bottom: -24px; width: 100%; text-align: center;
    font-size: 10px; color: rgba(255,255,255,0.4);
    font-weight: 500; font-family: 'Inter', sans-serif;
  }

  .milestone-line {
    position: absolute; left: 0; right: 0;
    z-index: 15; pointer-events: none;
  }
  .milestone-line-inner {
    border-top: 2px dashed rgba(255,255,255,0.25);
    width: 100%; position: relative;
  }
  .milestone-tag {
    position: absolute; right: 0; top: -26px;
    display: flex; align-items: center; gap: 5px;
    background: rgba(0,0,0,0.92);
    border: 1px solid rgba(0,173,102,0.6);
    border-radius: 5px; padding: 3px 8px;
    white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,0.4);
  }
  .milestone-tag-img {
    width: 20px; height: 20px; border-radius: 3px;
    object-fit: cover; flex-shrink: 0;
  }
  .milestone-tag-text {
    font-size: 10px; font-weight: 700;
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    letter-spacing: 0.5px; color: var(--fb-green); line-height: 1;
  }
  .milestone-tag-reward {
    font-size: 8px; color: rgba(255,255,255,0.5);
    font-family: 'Inter', sans-serif; font-weight: 500; line-height: 1.2;
  }
  .milestone-left-label {
    position: absolute; left: 0; top: -10px;
    font-size: 9px; font-weight: 700;
    font-family: 'Bebas Neue', 'Impact', sans-serif;
    letter-spacing: 0.5px; color: rgba(255,255,255,0.3);
    background: rgba(17,17,17,0.95); padding: 1px 5px; border-radius: 3px;
  }

  .incentive-key {
    margin-top: 14px; border-top: 1px solid rgba(255,255,255,0.06);
    padding-top: 12px;
    display: flex; flex-wrap: wrap; gap: 6px 14px;
  }
  .incentive-item {
    display: flex; align-items: center; gap: 5px;
    font-size: 10px; color: rgba(255,255,255,0.5);
  }
  .incentive-item-img {
    width: 14px; height: 14px; border-radius: 2px;
    object-fit: cover; flex-shrink: 0;
  }
  .incentive-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--fb-green); opacity: 0.6; flex-shrink: 0;
  }
  .incentive-item strong { color: var(--fb-green); }

  .footer {
    padding: 0 32px 24px; text-align: center;
    position: relative; z-index: 10;
  }
  .footer div {
    border-top: 1px solid rgba(255,255,255,0.05);
    padding-top: 16px; color: rgba(255,255,255,0.2); font-size: 10px;
  }

  @media (max-width: 900px) {
    .header { padding: 20px 16px 0; }
    .header h1 { font-size: 24px; }
    .charts-container { padding: 20px 16px 32px; flex-direction: column; }
    .chart-wrapper { min-width: 100%; }
    .bar-col { min-width: 32px; }
    .avatar-top { width: 34px; height: 34px; }
    .avatar-top span { font-size: 12px; }
  }
</style>
</head>
<body>

<script>
// ╔════════════════════════════════════════════════════════════════╗
// ║  GOOGLE SHEET URL — this is the only thing to configure      ║
// ╚════════════════════════════════════════════════════════════════╝

const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTWZrElUxkF-leelsN_AV8nFgMQAxnzdetRSGCiXkY9q8oe3hIThGZTF_F7eJHUuBemVQpeCIk7kv7J/pub?output=csv&cachebust=" + Date.now();

// ╔════════════════════════════════════════════════════════════════╗
// ║  INCENTIVE TIERS                                              ║
// ╚════════════════════════════════════════════════════════════════╝

const FOLLOWER_MILESTONES = [
  { value: 500,   label: "+500",    reward: "\u00A325 Amazon voucher",           image: "https://encrypted-tbn3.gstatic.com/shopping?q=tbn:ANd9GcT83up4fPW_Ase_rjCw-mKIO77KvFpcBRadxLl-vlENRio6xnfHBY4nymVoaSWZQ9rXM8_DONk-F2pMIwXRjQAPuUCfJjl8TMO1_amUcAjDCnZ4wie1uHRcCYzMN12jGukGSucqJifUozw&usqp=CAc", imgSize: 20 },
  { value: 1000,  label: "+1,000",  reward: "\u00A350 Meal out on us",          image: "https://i2-prod.devonlive.com/article10449445.ece/ALTERNATES/s1200f/1_RGP_MDM_270325Martin25JPG.jpg", imgSize: 20 },
  { value: 2500,  label: "+2,500",  reward: "\u00A3100 voucher of your choice", image: "https://www.theavonbridge.co.uk/wp-content/uploads/2017/06/giftvoucher.jpg", imgSize: 20 },
  { value: 5000,  label: "+5,000",  reward: "One night away (\u00A3150)",       image: "https://images.virginexperiencedays.co.uk/images/product/main/port-lympne-safari-one-11154303.jpg?auto=compress%2Cformat&w=1440&q=80&fit=max", imgSize: 20 },
  { value: 20000, label: "+20,000", reward: "All-inclusive weekend (\u00A3500)", image: "https://www.travelandleisure.com/thmb/L5GLWpe-XNL2jFMrUz9q_zWW81o=/1500x0/filters:no_upscale():max_bytes(150000):strip_icc()/playa-del-carmen-mexico-ROMLONGS0219_0-b812325a144b47c2a9a11907917be9d9.jpg", imgSize: 20 }
];

const IMPRESSION_MILESTONES = [
  { value: 5,  label: "5x",  reward: "\u00A320 voucher of your choice",  image: "https://www.theavonbridge.co.uk/wp-content/uploads/2017/06/giftvoucher.jpg", imgSize: 20 },
  { value: 10, label: "10x", reward: "\u00A350 voucher of your choice",  image: "https://www.theavonbridge.co.uk/wp-content/uploads/2017/06/giftvoucher.jpg", imgSize: 23 },
  { value: 20, label: "20x", reward: "\u00A3100 voucher of your choice", image: "https://www.theavonbridge.co.uk/wp-content/uploads/2017/06/giftvoucher.jpg", imgSize: 26 },
  { value: 50, label: "50x", reward: "\u00A3250 voucher of your choice", image: "https://www.theavonbridge.co.uk/wp-content/uploads/2017/06/giftvoucher.jpg", imgSize: 30 }
];

// ════════════════════════════════════════════════════════════════
// DATA LOADING FROM GOOGLE SHEETS
// ════════════════════════════════════════════════════════════════

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];

  // Parse header row - handle quoted values
  const parseRow = function(line) {
    const result = [];
    let current = '';
    let inQuotes = false;
    for (let c = 0; c < line.length; c++) {
      const ch = line[c];
      if (ch === '"') {
        inQuotes = !inQuotes;
      } else if (ch === ',' && !inQuotes) {
        result.push(current.trim());
        current = '';
      } else {
        current += ch;
      }
    }
    result.push(current.trim());
    return result;
  };

  const headers = parseRow(lines[0]);
  const data = [];

  for (let i = 1; i < lines.length; i++) {
    if (!lines[i].trim()) continue;
    const values = parseRow(lines[i]);
    if (values.length < 2) continue;
    const row = {};
    headers.forEach((h, idx) => { row[h] = values[idx] || ''; });
    if (!row.name || !row.name.trim()) continue;
    data.push({
      name: row.name || '',
      initials: row.initials || '',
      photo: row.photo || '',
      startFollowers: parseInt(row.startFollowers) || 0,
      monthStartFollowers: parseInt(row.monthStartFollowers) || 0,
      currentFollowers: parseInt(row.currentFollowers) || 0,
      impressionsMTD: parseInt(row.impressionsMTD) || 0
    });
  }
  return data;
}

async function loadData() {
  const loadingEl = document.getElementById('loading');
  const chartsEl = document.getElementById('charts');
  const errorEl = document.getElementById('error');

  try {
    // Try fetching with cors mode
    let response;
    try {
      response = await fetch(SHEET_CSV_URL, { mode: 'cors' });
    } catch (e) {
      // If CORS fails, try no-cors won't help for reading, so try redirect approach
      response = await fetch(SHEET_CSV_URL);
    }

    if (!response.ok) throw new Error('HTTP ' + response.status + ': ' + response.statusText);
    const text = await response.text();

    // Check if we got HTML instead of CSV (Google sometimes returns a login page)
    if (text.trim().startsWith('<!') || text.trim().startsWith('<html')) {
      throw new Error('Google Sheet returned HTML instead of CSV. Make sure the sheet is published: File > Share > Publish to web > select CSV > Publish');
    }

    const teamData = parseCSV(text);

    if (teamData.length === 0) throw new Error('No rows found. Check your column headers match exactly: name, initials, photo, startFollowers, monthStartFollowers, currentFollowers, impressionsMTD');

    loadingEl.style.display = 'none';
    chartsEl.style.display = 'flex';

    buildChart('chart-followers', {
      title: 'Follower Growth',
      subtitle: 'Net new followers gained since start',
      milestones: FOLLOWER_MILESTONES,
      getValue: p => p.currentFollowers - p.startFollowers,
      xAxisLabel: 'Started at \u2193',
      getBottomValue: p => p.startFollowers.toLocaleString(),
      unit: '+'
    }, teamData);

    buildChart('chart-impressions', {
      title: 'Impressions Ratio',
      subtitle: "Impressions month-to-date \u00F7 followers at start of month",
      milestones: IMPRESSION_MILESTONES,
      getValue: p => p.monthStartFollowers > 0 ? p.impressionsMTD / p.monthStartFollowers : 0,
      xAxisLabel: "Impressions MTD \u2193",
      getBottomValue: p => p.impressionsMTD.toLocaleString(),
      unit: 'x'
    }, teamData);

  } catch (err) {
    loadingEl.style.display = 'none';
    errorEl.style.display = 'block';
    errorEl.textContent = 'Could not load data from Google Sheet. Check that the sheet is published to web. Error: ' + err.message;
  }
}

// ════════════════════════════════════════════════════════════════
// CHART BUILDER
// ════════════════════════════════════════════════════════════════

function buildChart(containerId, config, teamData) {
  const { title, subtitle, milestones, getValue, xAxisLabel, getBottomValue, unit } = config;
  const sorted = [...teamData].sort((a, b) => getValue(b) - getValue(a));

  const highestMilestone = Math.max(...milestones.map(m => m.value));
  const maxData = Math.max(...sorted.map(getValue));
  const maxVal = Math.max(maxData, highestMilestone) * 1.12;

  const container = document.getElementById(containerId);
  container.querySelector('.chart-title').textContent = title;
  container.querySelector('.chart-subtitle').textContent = subtitle;
  container.querySelector('.x-axis-label').textContent = xAxisLabel;

  const chartArea = container.querySelector('.chart-area');
  const barZoneHeight = chartArea.offsetHeight - 30;

  // Evenly spaced milestones with room below first one for bars at zero
  const numMilestones = milestones.length;
  const SLOT_BOTTOM = 100;
  const SLOT_TOP = barZoneHeight - 20;
  const slotSpacing = (SLOT_TOP - SLOT_BOTTOM) / (numMilestones - 1 || 1);

  const milestonePixelMap = [];
  milestones.forEach((m, i) => {
    const bottomPx = SLOT_BOTTOM + i * slotSpacing;
    milestonePixelMap.push({ value: m.value, px: bottomPx - 30 });

    const line = document.createElement('div');
    line.className = 'milestone-line';
    line.style.bottom = bottomPx + 'px';

    const imgHTML = m.image
      ? '<img class="milestone-tag-img" src="' + m.image + '" alt="" style="width:' + (m.imgSize || 20) + 'px;height:' + (m.imgSize || 20) + 'px;">'
      : '';

    line.innerHTML =
      '<div class="milestone-line-inner">' +
        '<span class="milestone-left-label">' + m.label + '</span>' +
        '<div class="milestone-tag">' +
          imgHTML +
          '<div>' +
            '<div class="milestone-tag-text">' + m.label + '</div>' +
            '<div class="milestone-tag-reward">' + m.reward + '</div>' +
          '</div>' +
        '</div>' +
      '</div>';
    chartArea.appendChild(line);
  });

  function valueToPx(val) {
    if (val <= 0) return 0;
    var first = milestonePixelMap[0];
    var last = milestonePixelMap[milestonePixelMap.length - 1];
    if (val <= first.value) {
      return (val / first.value) * first.px;
    }
    if (val >= last.value) {
      var extra = (val - last.value) / last.value;
      return last.px + extra * (barZoneHeight - last.px) * 0.5;
    }
    for (var j = 0; j < milestonePixelMap.length - 1; j++) {
      var lo = milestonePixelMap[j];
      var hi = milestonePixelMap[j + 1];
      if (val >= lo.value && val <= hi.value) {
        var ratio = (val - lo.value) / (hi.value - lo.value);
        return lo.px + ratio * (hi.px - lo.px);
      }
    }
    return 0;
  }

  // Bars
  const barsRow = container.querySelector('.bars-row');
  sorted.forEach((person, i) => {
    const val = getValue(person);
    const barHeightPx = Math.max(valueToPx(val), 2);

    const col = document.createElement('div');
    col.className = 'bar-col';

    const topVal = document.createElement('div');
    topVal.className = 'bar-top-value';
    topVal.style.bottom = '0px';
    topVal.textContent = unit === 'x' ? val.toFixed(1) + 'x' : '+' + Math.round(val).toLocaleString();

    const avatar = document.createElement('div');
    avatar.className = 'avatar-top';
    avatar.style.bottom = '0px';
    avatar.innerHTML = person.photo
      ? '<img src="' + person.photo + '" alt="' + person.name + '" onerror="this.parentElement.innerHTML=\'<span>' + person.initials + '</span>\'">'
      : '<span>' + person.initials + '</span>';

    const bar = document.createElement('div');
    bar.className = 'bar';
    bar.style.height = '0px';

    const bottomVal = document.createElement('div');
    bottomVal.className = 'bar-bottom-value';
    bottomVal.textContent = getBottomValue(person);

    col.appendChild(topVal);
    col.appendChild(avatar);
    col.appendChild(bar);
    col.appendChild(bottomVal);
    barsRow.appendChild(col);

    setTimeout(function() {
      bar.style.height = barHeightPx + 'px';
      avatar.style.bottom = (barHeightPx + 4) + 'px';
      topVal.style.bottom = (barHeightPx + 48) + 'px';
    }, 150 + i * 100);
  });

  // Bottom incentive key
  const keyContainer = container.querySelector('.incentive-key');
  milestones.forEach(m => {
    const item = document.createElement('div');
    item.className = 'incentive-item';
    const threshold = unit === 'x' ? m.value + 'x' : '+' + m.value.toLocaleString();
    const imgHTML = m.image
      ? '<img class="incentive-item-img" src="' + m.image + '" alt="" style="width:' + ((m.imgSize || 20) * 0.7) + 'px;height:' + ((m.imgSize || 20) * 0.7) + 'px;">'
      : '<div class="incentive-dot"></div>';
    item.innerHTML = imgHTML + '<strong>' + threshold + '</strong> ' + m.reward;
    keyContainer.appendChild(item);
  });
}

window.addEventListener('DOMContentLoaded', loadData);
</script>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <div>
      <h1>LinkedIn Leaderboard</h1>
      <p class="subtitle">Grow your Fanbase — team performance tracker</p>
      <div class="eligibility-badge" style="margin-top:10px; display:inline-block;">*Must post once per week to be eligible</div>
